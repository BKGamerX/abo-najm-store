<script>
class Product {
  constructor() {
    this.OwnerName = "";
    this.productName = "";
    this.price = 0;
    this.quantity = 0;
    this.discounts = 0.0;
    this.vat = 0.0;
  }
  setOwnerName(ownername) {
    if (ownername && ownername.trim() !== "") {
      this.OwnerName = ownername;
      return "Done 1";
    } else {
      return "Invalid Customer Name";
    }
  }
  setProductName(name) {
    if (name && name.trim() !== "") {
      this.productName = name;
      return "Done 2";
    } else {
      return "Invalid Name";
    }
  }
  setPrice(price) {
    if (price > 0) {
      this.price = price;
      return "Done 3";
    } else {
      return "Invalid Price";
    }
  }
  setQuantity(quantity) {
    if (quantity >= 0) {
      this.quantity = quantity;
      return "Done 4";
    } else {
      return "Invalid Quantity";
    }
  }
  setDiscounts(discounts) {
    if (discounts >= 0) {
      this.discounts = discounts;
      return "Done 5";
    } else {
      return "invalid Discount";
    }
  }
  setVatTax(vat) {
    this.vat = vat;
  }
  getVatTax() {
    return (this.price * this.quantity) * (this.vat / 100);
  }
  getCalculateTotal() {
    return (this.price * this.quantity) - this.discounts;
  }
  getFinalPrice() {
    return this.getCalculateTotal() + this.getVatTax();
  }
}

let p1 = new Product();

function setOwnerName() {
  let value = document.getElementById('Customer Name').value;
  p1.setOwnerName(value);
}
function setProductName() {
  let value = document.getElementById('name').value;
  p1.setProductName(value);
}
function setPrice() {
  let value = parseFloat(document.getElementById('price').value);
  p1.setPrice(value);
}
function setQuantity() {
  let value = parseInt(document.getElementById('quantity').value);
  p1.setQuantity(value);
}
function setDiscounts() {
  let value = parseInt(document.getElementById('discounts').value);
  p1.setDiscounts(value);
}
function setVatTax() {
  let value = parseInt(document.getElementById('Vat Tax').value);
  p1.setVatTax(value);
}

function displayProduct() {
  document.getElementById('result').innerHTML = `
  <h3> Invoice</h3>
  <hr>
  <p><b>Customer Name:</b> ${p1.OwnerName} </p>
  <p><b>product Name:</b> ${p1.productName} </p>
  <p><b>price:</b> ${p1.price} </p>
  <p><b>quantity:</b> ${p1.quantity} </p>
  <p><b>discount:</b> ${p1.discounts} </p>
  <p><b>Vat Tax:</b> ${p1.getVatTax()} </p>
  <hr>
  <p><b>before Tax:</b> ${p1.getCalculateTotal()} </p>
  <p><b>Final Price:</b> ${p1.getFinalPrice()} </p>
  `;
}

function downloadInvoice() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(30);
  doc.text("Invoice", 80, 20);

  const today = new Date();
  const formattedDate = today.toLocaleDateString("en-US");

  doc.setFontSize(15);
  doc.text(`Date: ${formattedDate}`, 15, 15);

  doc.setFontSize(20);
  doc.text(`Customer:  ${p1.OwnerName}`, 20, 40);
  doc.text(`---------------------------------`, 14, 50);

  doc.text(`Product: ${p1.productName}`, 20, 60);
  doc.text(`----------------------`, 14, 70);

  doc.text(`Price: ${p1.price}`, 20, 80);
  doc.text(`-------------------------`, 14, 90);

  doc.text(`Quantity: ${p1.quantity}`, 20, 100);
  doc.text(`-----------------------------`, 14, 110);

  doc.text(`Discounts: ${p1.discounts}`, 20, 120);
  doc.text(`---------------------------------`, 14, 130);

  doc.text(`Vat Tax: ${p1.getVatTax()}`, 20, 140);
  doc.text(`--------------------------------------`, 14, 150);

  doc.text(`SubTotal: ${p1.getCalculateTotal()}`, 20, 160);
  doc.text(`-----------------------------------------------`, 14, 170);
  doc.text(`Final Price: ${p1.getFinalPrice()}`, 20, 180);

  doc.setFontSize(10);
  doc.text(`Thanks for using {Invoice Gen}: ${"®All Rights Reserved by Khalid Ahmed Abdu®"}`, 10, 280);

  doc.save("invoice.pdf");
}
